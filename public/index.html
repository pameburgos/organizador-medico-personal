<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Inicio de Sesión</title>
    
    <link rel="stylesheet" href="css/index.css">
    <script src="js/index.js" defer></script>>
</head>
<body>
    <main class="login-container">
        <form id="loginForm" class="login-form" novalidate>
            <h2>Iniciar Sesión</h2>
            
            <div class="form-group">
                <label for="user">Correo Electrónico</label>
                <input type="user" id="user" name="user" required autocomplete="user" aria-describedby="userError">
                <span class="error-message" id="userError" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" aria-describedby="passwordError">
                <span class="error-message" id="passwordError" aria-live="polite"></span>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
